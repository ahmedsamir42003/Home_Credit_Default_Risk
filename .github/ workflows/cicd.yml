name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  deploy:
    name: Download submission → Build Docker → Push to HF
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Install MLflow + DagsHub client ────────────────────────────────
      - name: Install dependencies
        run: pip install mlflow dagshub

      # ── 4. Download latest submission.csv from MLflow (DagsHub) ──────────
      - name: Download latest submission.csv from MLflow
        env:
          MLFLOW_TRACKING_URI:      ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os, mlflow
          from mlflow.tracking import MlflowClient

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          client = MlflowClient()

          # Find the experiment
          exp = client.get_experiment_by_name("home-credit-default-risk")
          if exp is None:
              raise RuntimeError("Experiment 'home-credit-default-risk' not found")

          # Get all runs sorted by end_time descending — pick the last FINISHED one
          runs = client.search_runs(
              experiment_ids=[exp.experiment_id],
              filter_string="status = 'FINISHED'",
              order_by=["end_time DESC"],
              max_results=1,
          )
          if not runs:
              raise RuntimeError("No finished runs found")

          run = runs[0]
          print(f"Using run: {run.info.run_id}  |  ended: {run.info.end_time}")

          # Download submission artifact
          # Tries 'submission/submission.csv' first, then root 'submission.csv'
          downloaded = False
          for artifact_path in ["submission/submission.csv", "submission.csv"]:
              try:
                  local = mlflow.artifacts.download_artifacts(
                      f"runs:/{run.info.run_id}/{artifact_path}",
                      dst_path="."
                  )
                  import shutil, pathlib
                  # flatten to ./submission.csv regardless of nested path
                  src = next(pathlib.Path(".").rglob("submission.csv"))
                  if str(src) != "submission.csv":
                      shutil.copy(src, "submission.csv")
                  print(f"Downloaded from: {artifact_path}")
                  downloaded = True
                  break
              except Exception as e:
                  print(f"Not found at {artifact_path}: {e}")

          if not downloaded:
              raise RuntimeError("submission.csv not found in any artifact path")

          # Quick sanity check
          import pandas as pd
          df = pd.read_csv("submission.csv")
          assert "SK_ID_CURR" in df.columns and "TARGET" in df.columns
          print(f"submission.csv OK — {len(df):,} rows")
          EOF

      # ── 5. Copy submission into the deploy app folder ─────────────────────
      - name: Inject submission.csv into app
        run: cp submission.csv deploy/app/submission.csv

      # ── 6. Log in to Hugging Face ─────────────────────────────────────────
      - name: Login to HuggingFace
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          api = HfApi(token='${{ secrets.HF_TOKEN }}')
          api.whoami()
          print('HF login OK')
          "

      # ── 7. Push all files to HF Space (Docker SDK) ────────────────────────
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api      = HfApi(token=os.environ["HF_TOKEN"])
          space_id = os.environ["HF_SPACE_ID"]

          # Create space if it doesn't exist yet
          try:
              api.create_repo(
                  repo_id=space_id,
                  repo_type="space",
                  space_sdk="docker",
                  exist_ok=True,
              )
          except Exception as e:
              print(f"create_repo: {e}")

          # Upload entire deploy/app folder
          api.upload_folder(
              folder_path="deploy/app",
              repo_id=space_id,
              repo_type="space",
              commit_message="ci: deploy latest submission.csv",
          )
          print(f"✅ Deployed → https://huggingface.co/spaces/{space_id}")
          EOF
